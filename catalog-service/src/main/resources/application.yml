spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:file:${moviehub.data-dir:./data}/catalog;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8081

grpc:
  server:
    port: 9090
    # 64 KiB chunks plus protobuf overhead fit comfortably in the default 4 MiB.
    max-inbound-message-size: 4MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

moviehub:
  data-dir: ./data
  artwork:
    dir: ${moviehub.data-dir}/artwork
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp


