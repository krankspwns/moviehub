spring:
  application:
    name: gateway-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  graphql:
    path: /graphql
    graphiql:
      enabled: true

server:
  port: 8080

grpc:
  client:
    catalog:
      address: ${CATALOG_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
      # Catalog sends/receives 64 KiB artwork chunks, far below this.
      max-inbound-message-size: 4MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

moviehub:
  catalog:
    call-timeout: 10s
    upload-timeout: 60s
  cors:
    allowed-origins: http://localhost:5173


